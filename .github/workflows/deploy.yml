name: Deploy OneStage Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Optimize images and generate project manifest
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save sharp@0.34.3
          node <<'NODE'
          const fs=require('fs'),path=require('path'),sharp=require('sharp')
          const dir=path.join(process.cwd(),'public','assets')
          const files=fs.readdirSync(dir)
          const projectFiles=files.filter(f=>/^project\d+_\d+\.jpe?g$/i.test(f))
          const homeFiles=files.filter(f=>/^home-(entertainment|collection)\.jpe?g$/i.test(f))
          const collectionFiles=files.filter(f=>/^duku-2401-cover\.jpe?g$/i.test(f))
          const grouped={}
          const jobs=[]
          for(const file of projectFiles){
            const m=file.match(/^project(\d+)_\d+\.jpe?g$/i),id=m[1],out=file.replace(/\.jpe?g$/i,'.webp')
            jobs.push(sharp(path.join(dir,file)).resize({width:2200,withoutEnlargement:true}).webp({quality:84,effort:5}).toFile(path.join(dir,out)).then(()=>{(grouped[id]??=[]).push(`/one-stage/assets/${out}`)}))
          }
          for(const file of [...homeFiles,...collectionFiles]){
            const out=file.replace(/\.jpe?g$/i,'.webp')
            jobs.push(sharp(path.join(dir,file)).resize({width:2200,withoutEnlargement:true}).webp({quality:84,effort:5}).toFile(path.join(dir,out)))
          }
          Promise.all(jobs).then(()=>{
            for(const id of Object.keys(grouped)) grouped[id].sort((a,b)=>Number(a.match(/_(\d+)\.webp$/)[1])-Number(b.match(/_(\d+)\.webp$/)[1]))
            fs.writeFileSync(path.join(process.cwd(),'public','project-images.json'),JSON.stringify(grouped,null,2))
            console.log(`Optimized ${jobs.length} images; ${projectFiles.length} project images indexed`)
          }).catch(err=>{console.error(err);process.exit(1)})
          NODE
      - name: Fetch podcast RSS and generate episode data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          FEED_URL='https://feed.xyzfm.space/r6r6p7dccgbw'
          TMP_XML=$(mktemp)
          if curl -fL --retry 3 --retry-delay 2 --max-time 60 -sS "$FEED_URL" -o "$TMP_XML"; then
            python3 - "$TMP_XML" <<'PY'
          import json,sys,xml.etree.ElementTree as ET
          from pathlib import Path
          root=ET.parse(Path(sys.argv[1])).getroot()
          def child(el,name):
              for item in list(el):
                  if item.tag.rsplit('}',1)[-1]==name:return item
          def text(el,name):
              node=child(el,name);return (node.text or '').strip() if node is not None else ''
          episodes=[];channel=child(root,'channel')
          if channel is not None:
              for item in channel:
                  if item.tag.rsplit('}',1)[-1]!='item':continue
                  title=text(item,'title');enclosure=child(item,'enclosure');audio_url=enclosure.attrib.get('url','').strip() if enclosure is not None else ''
                  if title and audio_url:episodes.append({'title':title,'audioUrl':audio_url,'pubDate':text(item,'pubDate'),'duration':text(item,'duration')})
          Path('public/episodes.json').write_text(json.dumps(episodes,ensure_ascii=False,indent=2),encoding='utf-8')
          print(f'Generated {len(episodes)} podcast episodes')
          PY
          else
            echo 'RSS fetch failed; keeping the last generated public/episodes.json.'
          fi
          rm -f "$TMP_XML"
      - name: Fetch latest YouTube and Bilibili video data
        shell: bash
        run: |
          set -euo pipefail
          YOUTUBE_VIDEO_ID='v9qaddGKum8'
          CHANNEL_PAGE='https://www.youtube.com/@NiumaHoliday'
          CHANNEL_HTML=$(curl -L -sS --max-time 30 -A 'Mozilla/5.0' "$CHANNEL_PAGE" || true)
          CHANNEL_ID=$(printf '%s' "$CHANNEL_HTML" | grep -oE '"channelId":"UC[0-9A-Za-z_-]+' | head -n 1 | cut -d'"' -f3 || true)
          if [ -n "$CHANNEL_ID" ]; then
            YT_XML=$(mktemp)
            if curl -fL --retry 2 --max-time 30 -sS "https://www.youtube.com/feeds/videos.xml?channel_id=${CHANNEL_ID}" -o "$YT_XML"; then
              LATEST=$(python3 - "$YT_XML" <<'PY'
          import sys,xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          for entry in root:
              if entry.tag.rsplit('}',1)[-1]=='entry':
                  for node in entry:
                      if node.tag.rsplit('}',1)[-1]=='videoId' and node.text:
                          print(node.text.strip());raise SystemExit
          PY
              )
              if [ -n "$LATEST" ]; then YOUTUBE_VIDEO_ID="$LATEST"; fi
            fi
            rm -f "$YT_XML"
          fi
          python3 - "$YOUTUBE_VIDEO_ID" <<'PY'
          import json,sys
          from pathlib import Path
          data={'youtubeVideoId':sys.argv[1],'bilibiliBvid':'BV18nbE6kE18'}
          Path('public/video-data.json').write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          print('Video data:',data)
          PY
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
